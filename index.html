<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>harmony&amp;aesthetic Land</title>

<!-- PWA: macht die Seite "installierbar" auf Handy/PC -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f0f10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="css/landing.css" />

<!-- Supabase-JS Library per CDN, kein npm/Build-Step noetig -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Three.js per CDN, kein Build-Step / npm noetig -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- LOGIN-ANSICHT -->
<div id="login-view" class="view">
  <form id="login-form" class="card">
    <h1>Headquarter</h1>
    <p class="subtitle">Bitte anmelden</p>

    <label for="email">E-Mail</label>
    <input type="email" id="email" required autocomplete="username" />

    <label for="password">Passwort</label>
    <input type="password" id="password" required autocomplete="current-password" />

    <button type="submit">Anmelden</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<!-- 3D-ANSICHT -->
<div id="app-view" class="hidden">
  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <div class="brand">harmony&amp;aesthetic <span>Land</span></div>
  <button id="logout-btn" class="ghost logout-floating">Abmelden</button>
  <div class="hint">Ziehen zum Drehen &middot; Scrollen zum Zoomen</div>
</div>

<script src="js/config.js"></script>
<script src="js/auth-gate.js"></script>
<script type="module" src="js/landing.js"></script>
</body>
</html>
