<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Headquarter · Cockpit</title>

<!-- PWA: macht die Seite "installierbar" auf Handy/PC -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f0f10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="css/style.css" />

<!-- Supabase-JS Library per CDN, kein npm/Build-Step noetig -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- LOGIN-ANSICHT -->
<div id="login-view" class="view">
  <form id="login-form" class="card">
    <h1>Headquarter</h1>
    <p class="subtitle">Bitte anmelden</p>

    <label for="email">E-Mail</label>
    <input type="email" id="email" required autocomplete="username" />

    <label for="password">Passwort</label>
    <input type="password" id="password" required autocomplete="current-password" />

    <button type="submit">Anmelden</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<!-- COCKPIT-UEBERSICHT -->
<div id="app-view" class="view hidden">
  <header class="topbar">
    <span id="user-email"></span>
    <button id="logout-btn" class="ghost">Abmelden</button>
  </header>

  <main class="tasks-panel">
    <section>
      <h2>Dringendste Aufgaben</h2>
      <div id="top-tasks" class="task-list"></div>
    </section>

    <section class="bereich-grid">
      <a href="studium.html" class="bereich-card">
        <h3>Studium</h3>
        <p id="metric-studium" class="bereich-metric">–</p>
      </a>
      <a href="mode.html" class="bereich-card">
        <h3>Modemarke</h3>
        <p id="metric-mode" class="bereich-metric">–</p>
      </a>
      <a href="tiktok.html" class="bereich-card">
        <h3>TikTok</h3>
        <p id="metric-tiktok" class="bereich-metric">–</p>
      </a>
    </section>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/auth-gate.js"></script>
<script src="js/shared.js"></script>
<script src="js/headquarter.js"></script>
</body>
</html>
